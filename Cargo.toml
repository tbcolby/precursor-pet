[package]
name = "pet"
version = "0.1.0"
authors = ["Tyler Colby"]
edition = "2021"
description = "Virtual pet (Tamagotchi-style) for Precursor"

[dependencies]
xous = "0.9.64"
xous-ipc = "0.10.2"
log-server = { package = "xous-api-log", version = "0.1.61" }
log = "0.4"
xous-names = { package = "xous-api-names", version = "0.9.63" }
gam = { path = "../../services/gam" }
ticktimer-server = { package = "xous-api-ticktimer", version = "0.9.61" }
num-derive = { version = "0.3", default-features = false }
num-traits = { version = "0.2", default-features = false }
